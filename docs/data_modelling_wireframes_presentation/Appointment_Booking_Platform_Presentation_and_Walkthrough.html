<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Booking Platform — System Design &amp; Walkthrough</title>
<style>
:root{
  --ink:#111827; --ink-soft:#4B5563; --ink-faint:#9CA3AF;
  --accent:#5B5BD6; --accent-soft:#EEF0FD;
  --bg:#F7F8FA; --panel:#FFFFFF; --border:#E5E7EB;
  --success:#0F7A5C; --success-bg:#E7F6F0;
  --error:#B3261E; --error-bg:#FCEBEA;
  --warning:#B45309; --warning-bg:#FDF3E3;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(17,24,39,0.04);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;}
body{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;cursor:pointer;}
input,select{font-family:inherit;}
#app{min-height:100vh;display:flex;flex-direction:column;}
.mono{font-family:var(--mono);}

/* ---------- top nav (walkthrough) ---------- */
.topnav{background:var(--panel);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 24px;justify-content:space-between;flex-shrink:0;}
.topnav .brand{font-weight:700;font-size:17px;letter-spacing:-0.02em;color:var(--ink);display:flex;align-items:center;gap:8px;cursor:pointer;}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.topnav-links{display:flex;gap:28px;font-size:14px;color:var(--ink-soft);}
.topnav-links a{padding:6px 2px;border-bottom:2px solid transparent;}
.topnav-links a.active{color:var(--ink);font-weight:600;border-bottom-color:var(--accent);}
.topnav-right{display:flex;align-items:center;gap:14px;}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;}
.user-chip .name{font-weight:600;line-height:1.1;}
.user-chip .sub{color:var(--ink-faint);font-size:12px;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--border);}

/* ---------- role switcher ---------- */
.role-bar{background:#0F1420;padding:10px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0;}
.role-bar .label{color:#8B93A7;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-right:6px;}
.role-btn{background:transparent;border:1px solid #2A3040;color:#C7CCDA;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;}
.role-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.role-btn:hover{border-color:#4A5064;color:#fff;}
.role-bar .spacer{flex:1;}
.ghost-link{color:#8B93A7;font-size:12.5px;border:none;background:transparent;}
.ghost-link:hover{color:#fff;}

/* ---------- guided banner ---------- */
.guided-bar{background:var(--accent);color:#fff;padding:10px 24px;display:flex;align-items:center;gap:14px;flex-shrink:0;font-size:13.5px;}
.guided-bar .step-pill{background:rgba(255,255,255,0.18);padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px;}
.guided-bar .desc{flex:1;}
.guided-bar button{background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;}
.guided-bar button:hover{background:rgba(255,255,255,0.28);}
.guided-bar button.exit{background:transparent;border:none;text-decoration:underline;}

/* ---------- layout shells ---------- */
.shell{flex:1;display:flex;}
.center-wrap{flex:1;display:flex;justify-content:center;padding:32px 24px 60px;}
.container{max-width:880px;width:100%;}
.container.wide{max-width:1080px;}

.sidebar-shell{flex:1;display:flex;}
.sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);padding:24px 12px;background:var(--panel);}
.sidebar .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;padding:0 12px;margin-bottom:8px;}
.sidebar a.item{display:block;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--ink-soft);font-weight:500;margin-bottom:2px;}
.sidebar a.item:hover{background:var(--bg);}
.sidebar a.item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.content-area{flex:1;padding:32px 36px 60px;overflow:auto;}

/* ---------- typography ---------- */
h1.page-title{font-size:24px;font-weight:700;letter-spacing:-0.02em;margin:0 0 4px;}
p.page-sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 28px;}
h2.section-title{font-size:16px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
.eyebrow-sm{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:6px;}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
.card + .card{margin-top:14px;}
.grid{display:grid;gap:14px;}
.grid.cols-1{grid-template-columns:1fr;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-6{grid-template-columns:repeat(6,1fr);}
@media(max-width:820px){.grid.cols-2,.grid.cols-3,.grid.cols-4,.grid.cols-6{grid-template-columns:1fr;}}

.metric-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.metric-card .val{font-size:26px;font-weight:700;letter-spacing:-0.02em;}
.metric-card .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

.select-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:.12s;}
.select-card:hover{border-color:#C7CCDA;box-shadow:0 2px 8px rgba(17,24,39,0.06);}
.select-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.select-card.disabled{opacity:.5;cursor:not-allowed;}
.select-card .title-row{display:flex;justify-content:space-between;align-items:center;}
.select-card .name{font-weight:600;font-size:15px;}
.select-card .meta{color:var(--ink-soft);font-size:13px;margin-top:3px;}
.select-card .price{font-weight:700;font-size:15px;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;}
.badge.confirmed{background:var(--success-bg);color:var(--success);}
.badge.completed{background:#EEF0FD;color:#3F3FA8;}
.badge.cancelled{background:#F1F2F4;color:#6B7280;}
.badge.noshow{background:var(--error-bg);color:var(--error);}
.badge.active{background:var(--success-bg);color:var(--success);}
.badge.inactive{background:#F1F2F4;color:#6B7280;}
.badge.warn{background:var(--warning-bg);color:var(--warning);}
.badge.info{background:var(--accent-soft);color:var(--accent);}

/* ---------- buttons ---------- */
.btn{border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{opacity:.9;}
.btn-outline{background:#fff;border-color:var(--border);color:var(--ink);}
.btn-outline:hover{border-color:var(--accent);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:none;padding:9px 10px;}
.btn-ghost:hover{color:var(--ink);}
.btn-danger-outline{background:#fff;border-color:var(--error-bg);color:var(--error);}
.btn-danger-outline:hover{background:var(--error-bg);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.btn-block{width:100%;justify-content:center;}
.btn-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:0 10px 10px;border-bottom:1px solid var(--border);}
td{padding:12px 10px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
td .sub{color:var(--ink-faint);font-size:12px;}

/* ---------- calendar / time slots ---------- */
.day-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.day-btn{flex-shrink:0;width:64px;text-align:center;padding:10px 4px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:12.5px;cursor:pointer;}
.day-btn .dow{color:var(--ink-faint);font-size:10.5px;text-transform:uppercase;font-weight:700;}
.day-btn .num{font-size:16px;font-weight:700;margin-top:2px;}
.day-btn.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.day-btn.selected .dow{color:var(--accent);}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:6px;}
.slot-btn{padding:10px 6px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;text-align:center;cursor:pointer;}
.slot-btn:hover:not(:disabled){border-color:var(--accent);}
.slot-btn.selected{background:var(--ink);border-color:var(--ink);color:#fff;}
.slot-btn.blocked,.slot-btn.booked{background:#F7F8FA;color:var(--ink-faint);border-color:var(--border);cursor:not-allowed;text-decoration:line-through;}

/* ---------- misc ---------- */
.divider{height:1px;background:var(--border);margin:16px 0;}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;}
.kv .k{color:var(--ink-soft);}
.kv .v{font-weight:600;}
.banner{border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;}
.banner.info{background:var(--accent-soft);color:#3F3FA8;}
.banner.warn{background:var(--warning-bg);color:var(--warning);}
.banner.error{background:var(--error-bg);color:var(--error);}
.banner.success{background:var(--success-bg);color:var(--success);}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .icon{font-size:26px;margin-bottom:10px;}
.empty-state h3{margin:0 0 6px;color:var(--ink);font-size:15.5px;}
.empty-state p{margin:0;font-size:13.5px;}
.breadcrumb{font-size:12.5px;color:var(--ink-faint);margin-bottom:14px;}
.breadcrumb b{color:var(--ink-soft);}
.footer-note{margin-top:20px;text-align:center;font-size:12px;color:var(--ink-faint);}
.footer-note a{text-decoration:underline;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 0;}
input[type=text],input[type=time],input[type=date],select{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;width:100%;}
label.field-label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}
.field{margin-bottom:12px;}

/* entry screen */
.hero{text-align:center;padding:64px 24px 20px;}
.hero h1{font-size:34px;font-weight:700;letter-spacing:-0.03em;margin:0 0 12px;max-width:640px;margin-left:auto;margin-right:auto;}
.hero p{color:var(--ink-soft);font-size:16px;max-width:520px;margin:0 auto 28px;}
.role-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:920px;margin:0 auto;padding:0 24px;}
@media(max-width:820px){.role-grid{grid-template-columns:1fr 1fr;}}
.role-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px 18px;text-align:left;cursor:pointer;}
.role-card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(17,24,39,0.06);}
.role-card .num{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.05em;margin-bottom:10px;}
.role-card .t{font-weight:700;font-size:15.5px;margin-bottom:4px;}
.role-card .d{font-size:13px;color:var(--ink-soft);}

/* ---------- PRESENTATION DECK ---------- */
.deck-shell{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.deck-topbar{height:52px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;padding:0 20px;gap:16px;}
.deck-topbar .brand{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;}
.deck-topbar .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
.deck-topbar .section-label{color:var(--ink-faint);font-size:12.5px;flex:1;text-align:center;}
.deck-topbar .counter{font-size:12.5px;color:var(--ink-soft);font-weight:600;font-family:var(--mono);}
.deck-progress{height:3px;background:var(--border);flex-shrink:0;}
.deck-progress-fill{height:100%;background:var(--accent);transition:width .25s;}
.deck-body{flex:1;display:flex;align-items:center;justify-content:center;padding:36px 40px;overflow:auto;}
.slide{max-width:980px;width:100%;animation:fadein .28s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.slide-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
.slide h1{font-size:32px;font-weight:700;letter-spacing:-0.02em;margin:0 0 8px;}
.slide h1.center{text-align:center;}
.slide .sub{color:var(--ink-soft);font-size:15.5px;margin:0 0 26px;max-width:680px;}
.slide .sub.center{text-align:center;margin-left:auto;margin-right:auto;}
.deck-bottombar{height:56px;flex-shrink:0;border-top:1px solid var(--border);background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.deck-nav-btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 16px;font-size:13.5px;font-weight:600;}
.deck-nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.deck-dots{display:flex;gap:5px;}
.deck-dots span{width:5px;height:5px;border-radius:50%;background:var(--border);}
.deck-dots span.on{background:var(--accent);width:14px;border-radius:3px;}

.flow-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.flow-chip{background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;}
.flow-chip.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.flow-arrow{color:var(--ink-faint);font-size:16px;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:820px){.two-col{grid-template-columns:1fr;}}
.col-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;padding:8px 12px;border-radius:8px;}
.col-title.in{background:var(--success-bg);color:var(--success);}
.col-title.out{background:#F1F2F4;color:var(--ink-soft);}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:#fff;border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;}

.ent-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.ent-card .name{font-weight:700;font-size:13.5px;margin-bottom:8px;}
.ent-card .field{font-size:12px;font-family:var(--mono);color:var(--ink-soft);padding:2px 0;}
.ent-card .field.pk{color:var(--ink);font-weight:700;}
.ent-card.identity{border-top:3px solid #8B7EDB;}
.ent-card.business{border-top:3px solid var(--ink-faint);}
.ent-card.scheduling{border-top:3px solid #2FA98C;}
.ent-card.appt{border-top:3px solid var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.ent-card.package{border-top:3px solid var(--warning);}
.cardinality{font-size:10.5px;font-family:var(--mono);color:var(--ink-faint);text-align:center;padding:2px 0;}

.tab-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.tab-btn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
</style>
</head>
<body>
<div id="app"></div>
<script>

const APP = { mode: 'deck' }; // 'deck' | 'walkthrough'

/* ============================= WALKTHROUGH DATA MODEL ============================= */

function fmtDate(dateStr){ const d=new Date(dateStr+'T00:00:00'); return d.toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'}); }

/* ============================= HELPERS ============================= */
function business(id){ return S.businesses.find(b=>b.id===id); }
function service(id){ return S.services.find(s=>s.id===id); }
function provider(id){ return S.providers.find(p=>p.id===id); }
function servicesFor(bizId, activeOnly){ return S.services.filter(s=>s.businessId===bizId && (!activeOnly || s.active)); }
function providersFor(bizId, activeOnly){ return S.providers.filter(p=>p.businessId===bizId && (!activeOnly || p.active)); }
function assignedServiceIds(provId){ return S.assignments[provId] || []; }
function isAssigned(provId, svcId){ return assignedServiceIds(provId).includes(svcId); }
function eligibleProviders(bizId, svcId){ return providersFor(bizId, true).filter(p => isAssigned(p.id, svcId)); }
function priceLabel(svc){ return svc.price==null ? '—' : ('R'+svc.price); }
function badgeClass(status){ return { CONFIRMED:'confirmed', COMPLETED:'completed', CANCELLED:'cancelled', NO_SHOW:'noshow' }[status] || ''; }
function activeProviderCount(bizId){ return providersFor(bizId, true).length; }
function packageMax(bizId){ return S.packages[business(bizId).package].max; }

function computeSlots(providerId, serviceId, dateStr, excludeApptId){
  const svc = service(serviceId);
  const day = dayAbbr(dateStr);
  const wh = (S.workingHours[providerId]||{})[day];
  if(!wh) return [];
  const dur = svc.duration;
  const startMin = timeToMin(wh.start), endMin = timeToMin(wh.end);
  const slots = [];
  for(let cur=startMin; cur+dur<=endMin; cur+=30){
    const s=cur, e=cur+dur;
    let status='available';
    for(const u of S.unavailability){
      if(u.providerId===providerId && u.date===dateStr){
        const us=timeToMin(u.start), ue=timeToMin(u.end);
        if(s<ue && e>us){ status='blocked'; break; }
      }
    }
    if(status==='available'){
      for(const a of S.appointments){
        if(a.id===excludeApptId) continue;
        if(a.providerId===providerId && a.date===dateStr && a.status==='CONFIRMED'){
          const as=timeToMin(a.start), ae=timeToMin(a.end);
          if(s<ae && e>as){ status='booked'; break; }
        }
      }
    }
    slots.push({ start: minToTime(s), end: minToTime(e), status });
  }
  return slots;
}

function confirmReschedule(){
  const a = S.appointments.find(x=>x.id===S.ctx.apptId);

    return;

  a.date = S.ctx.date; a.start = S.ctx.time; a.end = minToTime(timeToMin(S.ctx.time)+svc.duration);
  toast('Appointment rescheduled.');
  go('c6');

function renderConsoleShell(kind){
  const items = kind==='business'
    ? [['ba1','Dashboard'],['ba2','Services'],['ba3','Providers'],['ba4','Assignments'],['ba5','Appointments']]
    : kind==='provider'
    ? [['sp1','My Schedule'],['sp2','Working Hours'],['sp3','Block Time'],['sp4','Appointment Detail']]
    : [['pa1','Businesses'],['pa2','Package Assignment']];
  const eyebrow = kind==='business' ? 'Business Console' : kind==='provider' ? 'Provider Hub' : 'Platform Console';
  if(!items.find(i=>i[0]===S.screen)) S.screen = items[0][0];
  let inner = '';
  if(kind==='business'){
    if(S.screen==='ba1') inner = screenBA1();
    if(S.screen==='ba2') inner = screenBA2();
    if(S.screen==='ba3') inner = screenBA3();
    if(S.screen==='ba4') inner = screenBA4();
    if(S.screen==='ba5') inner = screenBA5();
  } else if(kind==='provider'){
    if(S.screen==='sp1') inner = screenSP1();
    if(S.screen==='sp2') inner = screenSP2();
    if(S.screen==='sp3') inner = screenSP3();
    if(S.screen==='sp4') inner = screenSP4();
  } else {
    if(S.screen==='pa1') inner = screenPA1();
    if(S.screen==='pa2') inner = screenPA2();
  }
  return `
  <div class="sidebar-shell">
    <div class="sidebar">
      <div class="eyebrow">${eyebrow}</div>
      ${items.map(i=>`<a class="item ${S.screen===i[0]?'active':''}" onclick="go('${i[0]}')">${i[1]}</a>`).join('')}
    </div>
    <div class="content-area"><div class="container wide">${inner}</div></div>
  </div>`;
}

let availDuration = 30, availInterval = 30, availBlocked = true, availBooked = true;
function computeDemoSlots(){
  const startMin = 540, endMin = 960; // 09:00-16:00
  const slots = [];
  for(let cur=startMin; cur+availDuration<=endMin; cur+=availInterval){
    let status='available';
    if(availBlocked && cur < 780 && cur+availDuration > 720) status='blocked'; // 12:00-13:00 block
    if(status==='available' && availBooked && cur < 660 && cur+availDuration > 630) status='booked'; // 10:30-11:00 booked
    slots.push({ t: minToTime(cur), status });
  }
  return slots;
}

/* ============================= DECK RENDER / NAV ============================= */
function renderDeck(){
  const app = document.getElementById('app');
  const s = SLIDES[DECK.index];
  const pct = ((DECK.index+1)/SLIDES.length)*100;
  app.innerHTML = `
  <div class="deck-shell">
    <div class="deck-topbar">
      <div class="brand"><span class="dot"></span>AppointHub</div>
      <div class="section-label">${s.section}</div>
      <div class="counter">${String(DECK.index+1).padStart(2,'0')} / ${String(SLIDES.length).padStart(2,'0')}</div>
    </div>
    <div class="deck-progress"><div class="deck-progress-fill" style="width:${pct}%;"></div></div>
    <div class="deck-body"><div class="slide">${s.render()}</div></div>
    <div class="deck-bottombar">
      <button class="deck-nav-btn" onclick="deckPrev()" ${DECK.index===0?'disabled':''}>← Previous</button>
      <div class="deck-dots">${SLIDES.map((_,i)=>`<span class="${i===DECK.index?'on':''}"></span>`).join('')}</div>
      <div style="display:flex;gap:10px;">
        <button class="deck-nav-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        ${DECK.index===SLIDES.length-1 ? '' : `<button class="deck-nav-btn" style="background:var(--ink);color:#fff;border-color:var(--ink);" onclick="deckNext()">Next →</button>`}
      </div>
    </div>
  </div>`;
}
function deckNext(){ if(DECK.index < SLIDES.length-1){ DECK.index++; renderDeck(); } }
function deckPrev(){ if(DECK.index > 0){ DECK.index--; renderDeck(); } }
function toggleFullscreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else { document.exitFullscreen().catch(()=>{}); }
}
document.addEventListener('keydown', (e)=>{
  if(APP.mode !== 'deck') return;
  if(e.key==='ArrowRight'||e.key===' ') { deckNext(); }
  else if(e.key==='ArrowLeft'){ deckPrev(); }
  else if(e.key==='Home'){ DECK.index=0; renderDeck(); }
  else if(e.key==='End'){ DECK.index=SLIDES.length-1; renderDeck(); }
});

/* ============================= INIT ============================= */
