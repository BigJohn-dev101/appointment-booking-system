<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  USERS ||--o| SOLE_PROVIDERS : "is a"
  USERS ||--o| BUSINESSES : owns
  USERS ||--o| BUSINESS_STAFF : "is a"
  USERS ||--o{ APPOINTMENTS : books
  BUSINESSES ||--o{ BUSINESS_STAFF : employs
  BUSINESSES ||--o{ SERVICES : offers
  SOLE_PROVIDERS ||--o{ SERVICES : offers
  BUSINESSES ||--|| PROVIDER_SUBSCRIPTIONS : subscribes
  SOLE_PROVIDERS ||--|| PROVIDER_SUBSCRIPTIONS : subscribes
  PACKAGES ||--o{ PROVIDER_SUBSCRIPTIONS : defines
  SOLE_PROVIDERS ||--o{ APPOINTMENTS : provides
  BUSINESS_STAFF ||--o{ APPOINTMENTS : provides
  SERVICES ||--o{ APPOINTMENTS : "booked as"
  SOLE_PROVIDERS ||--o{ AVAILABILITY : sets
  BUSINESS_STAFF ||--o{ AVAILABILITY : sets
  USERS {
    uuid id PK
    string email
    string role
  }
  SOLE_PROVIDERS {
    uuid id PK
    uuid user_id FK
    string display_name
  }
  BUSINESSES {
    uuid id PK
    uuid owner_user_id FK
    string name
  }
  BUSINESS_STAFF {
    uuid id PK
    uuid business_id FK
    uuid user_id FK
  }
  PACKAGES {
    uuid id PK
    string provider_type
    string tier
    int daily_appointment_limit
    int max_staff
  }
  PROVIDER_SUBSCRIPTIONS {
    uuid id PK
    uuid sole_provider_id FK
    uuid business_id FK
    uuid package_id FK
    string status
    date next_billing_date
    date grace_period_ends_at
  }
  SERVICES {
    uuid id PK
    uuid sole_provider_id FK
    uuid business_id FK
    string name
    int duration_minutes
    decimal expected_price
  }
  AVAILABILITY {
    uuid id PK
    uuid sole_provider_id FK
    uuid staff_id FK
    int day_of_week
    time start_time
    time end_time
  }
  APPOINTMENTS {
    uuid id PK
    uuid customer_id FK
    uuid service_id FK
    uuid sole_provider_id FK
    uuid staff_id FK
    uuid business_id FK
    datetime scheduled_start
    string status
    boolean no_show
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
